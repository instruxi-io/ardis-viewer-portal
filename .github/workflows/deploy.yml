name: Deploy

on:
  push:
    branches:
      - master      # → staging (ardis-viewer-portal.pages.dev)
      - production  # → production (when domain exists)
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: false
        default: 'staging'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'production' && 'production' || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # Envelope parity with the Flutter app, and the no-markup-sinks guard.
      # A regression in either ships silently otherwise.
      - name: Checks
        run: npm run check

      - name: Build
        run: npm run build
        env:
          # These come from the GitHub Environment (staging or production).
          # Set them in: GitHub repo → Settings → Environments → staging/production → Variables
          VITE_ARDIS_API_BASE: ${{ vars.VITE_ARDIS_API_BASE }}
          VITE_ENFORCER_BASE: ${{ vars.VITE_ENFORCER_BASE }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=ardis-viewer-portal

      # This pipeline deploys to Cloudflare. The platform hands EMPLOYERS a
      # different host: ardis-ms VIEWER_BASE_URL points at credpass-viewer on
      # Vercel. A green build here therefore proved nothing about what an
      # employer opens, and viewer fixes sat undelivered behind a passing CI —
      # which is exactly what happened on 4 September, when a day of viewer
      # work went live on the host nobody reads.
      #
      # Until the two are one host, this step is the alarm. It fails the build
      # when the URL the platform actually hands out is not serving what we
      # just built. Fixing it means deploying to the live host as well, or
      # repointing VIEWER_BASE_URL here and in fly.toml.
      - name: The live viewer must serve what we just built
        run: |
          set -euo pipefail
          LIVE="https://credpass-viewer.vercel.app/view"
          BUILT="$(basename "$(ls dist/assets/main-*.js | head -1)")"
          echo "built:  $BUILT"
          SERVED="$(curl -fsS "$LIVE" | grep -oE 'main-[A-Za-z0-9_-]+\.js' | head -1 || true)"
          echo "served: ${SERVED:-<none>} at $LIVE"
          if [ "$SERVED" != "$BUILT" ]; then
            echo "::error::$LIVE is serving '${SERVED:-nothing}', not '$BUILT'."
            echo "::error::CI deployed to Cloudflare; employers open the URL above."
            echo "::error::Deploy this build to that host, or repoint VIEWER_BASE_URL."
            exit 1
          fi
